; PlatformIO Project Configuration File
;
; drv8833-motor-test — minimal DRV8833 motor driver bring-up test
; Second ESP32-S3 N16R8 board. No LEDs, no microphone, no buttons.
; Completely separate from the sunflower-esp32-s3 project.
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 MB flash, 8 MB octal PSRAM
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Verified via lsusb (QinHeng/WCH "USB Single Serial", VID:PID 1a86:55d3):
; this board's USB-C port is bridged to UART0 by an external CH34x chip,
; same as the other ESP32-S3 board in this workspace, not the ESP32-S3's
; native USB-OTG peripheral. USB_CDC_ON_BOOT=1 asks the Arduino core to
; route Serial over native USB-OTG (GPIO19/20), which is NOT wired to a
; connector on this board and would produce no output on /dev/ttyACM0.
; ARDUINO_USB_MODE=0 keeps Serial on UART0, which the CH34x bridge exposes
; as /dev/ttyACM0. This is the setting that actually gets "USB CDC serial"
; (a working USB-attached console at 115200) working on THIS hardware.
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
upload_speed = 921600
