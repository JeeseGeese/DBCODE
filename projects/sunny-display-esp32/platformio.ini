; PlatformIO Project Configuration File — Sunny UI Controller
;
; Hardware: ELEGOO ESP32 2.8" Touch Display (ESP32-WROOM-32E, ILI9341,
; XPT2046 resistive touch), LCDWIKI model E32R28T. See docs/DISPLAY_HARDWARE.md
; for the full, source-cited pin map -- verified against LCDWIKI's official
; "2.8inch ESP32-32E E32R28T&E32N28T User Manual" schematic (exact model
; match), not a generic "Cheap Yellow Display" tutorial.
;
; This is a SEPARATE, independently buildable project from
; projects/sunflower-esp32-s3/ (the Sunny body controller) -- see
; docs/DISPLAY_HARDWARE.md for the two-controller architecture rationale.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-wroom-32e]
platform = espressif32
; Generic ESP32-WROOM-32 devkit profile -- this board's ESP32-WROOM-32E
; module is pin-compatible with the standard WROOM-32 footprint; no
; special flash/PSRAM board variant exists for it in platformio's board
; database (confirmed: no PSRAM on this module -- see DISPLAY_HARDWARE.md).
board = esp32dev
framework = arduino

; Confirmed via the official LCDWIKI schematic: ESP32-WROOM-32E module,
; 4MB QSPI flash, no PSRAM (448KB ROM + 520KB SRAM + 16KB RTC SRAM only).
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 921600

; LV_CONF_INCLUDE_SIMPLE: lets LVGL find this project's own lv_conf.h via
; a plain #include "lv_conf.h" (searched via build_flags include path)
; rather than requiring it to live one directory above the library --
; keeps the config file inside this project, not patched into a library
; folder.
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ ^9.5.0
